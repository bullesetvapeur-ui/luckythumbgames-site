<!DOCTYPE html>

<canvas id="c"></canvas>
<script>
"use strict";
/* =========================================================
   SNEAKY DASH — Lucky Thumb
   Trace la fuite de chaque voleur jusqu'à son camion.
   Tout le monde part en même temps : pas de collision, pas de garde, pas de laser.
   ========================================================= */

// ---------- SDK : vrai ytgame sur YouTube, mock ailleurs ----------
const IN_YT = typeof ytgame !== "undefined" && ytgame.IN_PLAYABLES_ENV;
const SDK = (() => {
  if (IN_YT) return ytgame;
  const log = (...a) => console.log("[ytgame mock]", ...a);
  return {
    IN_PLAYABLES_ENV: false,
    game: {
      firstFrameReady: () => log("firstFrameReady"),
      gameReady: () => log("gameReady"),
      loadData: async () => { try { return localStorage.getItem("sneakydash") || ""; } catch (e) { return ""; } },
      saveData: async (d) => { try { localStorage.setItem("sneakydash", d); } catch (e) {} log("saveData", d); },
    },
    system: {
      onPause: () => {}, onResume: () => {},
      isAudioEnabled: () => true, onAudioEnabledChange: () => {},
      getLanguage: async () => navigator.language || "en",
    },
    engagement: { sendScore: async (s) => log("sendScore", s) },
    ads: {
      requestInterstitialAd: async () => log("interstitial (mock)"),
      requestRewardedAd: async (id) => { log("rewarded (mock)", id); return true; },
    },
    health: { logError: () => {}, logWarning: () => {} },
  };
})();

// ---------- Canvas (espace logique 720x1280) ----------
const W = 720, H = 1280;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let scale = 1, ox = 0, oy = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  scale = Math.min(cv.width / W, cv.height / H);
  ox = (cv.width - W * scale) / 2; oy = (cv.height - H * scale) / 2;
}
addEventListener("resize", resize); resize();
const toWorld = (cx, cy) => ({ x: (cx * dpr - ox) / scale, y: (cy * dpr - oy) / scale });

// ---------- Palette ----------
const COL = {
  ink: "#1d1530", bg: "#3a2a55", bg2: "#2b1d3a", tile1: "#f3e3c3", tile2: "#e8d3ab", carpet: "#c0392b",
  white: "#ffffff", gold: "#ffc93c", laser: "#ff2e4d", guard: "#3d5afe", glass: "rgba(173,216,255,.55)",
  chars: { red: "#ff4d5e", blue: "#3d8bff", yellow: "#ffc93c", purple: "#a66cff", green: "#3ddc84" },
};

// ---------- Butin (20 objets = 10 formes x 2 variantes) ----------
const LOOT = [
  ["diamond", "#5ad1ff", "Blue Diamond"], ["crown", "#ffc93c", "Golden Crown"], ["bar", "#ffc93c", "Gold Bar"], ["painting", "#ff8a3d", "Sunset Painting"],
  ["ring", "#ff4d8d", "Pink Ring"], ["vase", "#3d8bff", "Ming Vase"], ["banana", "#ffc93c", "Golden Banana"], ["trophy", "#ffc93c", "Gold Trophy"],
  ["duck", "#ffc93c", "Golden Duck"], ["toilet", "#ffc93c", "Golden Toilet"], ["diamond", "#ff2e4d", "Ruby"], ["crown", "#cfd8dc", "Silver Crown"],
  ["bar", "#cfd8dc", "Platinum Bar"], ["painting", "#3ddc84", "Mona Pizza"], ["ring", "#5ad1ff", "Ice Ring"], ["vase", "#ff4d5e", "Lava Vase"],
  ["banana", "#a66cff", "Galaxy Banana"], ["trophy", "#5ad1ff", "Crystal Cup"], ["duck", "#ff4d8d", "Disco Duck"], ["toilet", "#5ad1ff", "Diamond Toilet"],
];

// ---------- Niveaux ----------
// c: voleurs {x,y,k}, h: camions {x,y,k}, w: vitrines [x,y,w,h]
// g: gardes {x1,y1,x2,y2,sp}  l: lasers {x1,y1,x2,y2,on,per,ph}  m: caméras {x,y,a,sw,sp}
const LV = (o) => ({ w: [], g: [], l: [], m: [], ...o });
const LEVELS = [
  LV({ c: [{ x: 360, y: 1020, k: "red" }], h: [{ x: 360, y: 340, k: "red" }], hint: true }),                                   // 1 tuto
  LV({ c: [{ x: 360, y: 1020, k: "red" }], h: [{ x: 360, y: 340, k: "red" }], w: [[250, 620, 220, 100]] }),                      // 2 contourner
  LV({ c: [{ x: 200, y: 1020, k: "red" }, { x: 520, y: 1020, k: "blue" }], h: [{ x: 200, y: 340, k: "red" }, { x: 520, y: 340, k: "blue" }] }), // 3 deux
  LV({ c: [{ x: 160, y: 1020, k: "red" }, { x: 560, y: 1020, k: "blue" }], h: [{ x: 560, y: 340, k: "red" }, { x: 160, y: 340, k: "blue" }] }), // 4 croisement
  LV({ c: [{ x: 180, y: 1020, k: "red" }, { x: 540, y: 1020, k: "blue" }], h: [{ x: 540, y: 340, k: "red" }, { x: 180, y: 340, k: "blue" }], w: [[300, 560, 120, 240]] }), // 5
  LV({ c: [{ x: 360, y: 1020, k: "red" }], h: [{ x: 360, y: 340, k: "red" }], g: [{ x1: 200, y1: 680, x2: 520, y2: 680, sp: 0.7 }], tip: "Avoid the guard's flashlight!" }), // 6 garde
  LV({ c: [{ x: 180, y: 1020, k: "red" }, { x: 540, y: 1020, k: "blue" }], h: [{ x: 180, y: 340, k: "red" }, { x: 540, y: 340, k: "blue" }], g: [{ x1: 260, y1: 680, x2: 460, y2: 680, sp: 0.8 }] }), // 7
  LV({ c: [{ x: 140, y: 1020, k: "red" }, { x: 360, y: 1020, k: "blue" }, { x: 580, y: 1020, k: "yellow" }], h: [{ x: 580, y: 340, k: "red" }, { x: 140, y: 340, k: "blue" }, { x: 360, y: 340, k: "yellow" }] }), // 8 trois
  LV({ c: [{ x: 160, y: 1020, k: "red" }, { x: 560, y: 1020, k: "blue" }], h: [{ x: 560, y: 340, k: "red" }, { x: 160, y: 340, k: "blue" }], w: [[60, 640, 230, 70], [430, 640, 230, 70]] }), // 9 couloir
  LV({ c: [{ x: 140, y: 1020, k: "red" }, { x: 360, y: 1020, k: "blue" }, { x: 580, y: 1020, k: "yellow" }], h: [{ x: 360, y: 340, k: "red" }, { x: 580, y: 340, k: "blue" }, { x: 140, y: 340, k: "yellow" }], w: [[250, 520, 220, 70]], g: [{ x1: 150, y1: 800, x2: 570, y2: 800, sp: 0.6 }], boss: true }), // 10 BOSS
  LV({ c: [{ x: 360, y: 1020, k: "red" }], h: [{ x: 360, y: 340, k: "red" }], l: [{ x1: 60, y1: 680, x2: 520, y2: 680, on: 1.0, per: 2.0, ph: 0 }], tip: "Lasers blink. Time it or go around!" }), // 11 laser
  LV({ c: [{ x: 200, y: 1020, k: "red" }, { x: 520, y: 1020, k: "blue" }], h: [{ x: 520, y: 340, k: "red" }, { x: 200, y: 340, k: "blue" }], l: [{ x1: 120, y1: 620, x2: 600, y2: 620, on: 0.9, per: 1.8, ph: 0.9 }] }), // 12
  LV({ c: [{ x: 200, y: 1020, k: "red" }, { x: 520, y: 1020, k: "blue" }], h: [{ x: 200, y: 340, k: "red" }, { x: 520, y: 340, k: "blue" }], l: [{ x1: 60, y1: 560, x2: 460, y2: 560, on: 1.0, per: 2.0, ph: 0 }], g: [{ x1: 260, y1: 840, x2: 600, y2: 840, sp: 0.7 }] }), // 13
  LV({ c: [{ x: 360, y: 1020, k: "red" }], h: [{ x: 360, y: 340, k: "red" }], m: [{ x: 360, y: 680, a: 0, sw: 1.4, sp: 0.8 }], tip: "Cameras see everything in their light!" }), // 14 caméra
  LV({ c: [{ x: 140, y: 1020, k: "red" }, { x: 360, y: 1020, k: "blue" }, { x: 580, y: 1020, k: "yellow" }], h: [{ x: 140, y: 340, k: "red" }, { x: 360, y: 340, k: "blue" }, { x: 580, y: 340, k: "yellow" }], m: [{ x: 60, y: 680, a: 0, sw: 0.9, sp: 0.7 }] }), // 15
  LV({ c: [{ x: 160, y: 1020, k: "red" }, { x: 560, y: 1020, k: "blue" }], h: [{ x: 560, y: 340, k: "red" }, { x: 160, y: 340, k: "blue" }], l: [{ x1: 60, y1: 520, x2: 440, y2: 520, on: 1.0, per: 2.0, ph: 0 }, { x1: 280, y1: 820, x2: 660, y2: 820, on: 1.0, per: 2.0, ph: 1.0 }] }), // 16
  LV({ c: [{ x: 110, y: 1020, k: "red" }, { x: 270, y: 1020, k: "blue" }, { x: 450, y: 1020, k: "yellow" }, { x: 610, y: 1020, k: "purple" }], h: [{ x: 610, y: 340, k: "red" }, { x: 450, y: 340, k: "blue" }, { x: 270, y: 340, k: "yellow" }, { x: 110, y: 340, k: "purple" }] }), // 17 quatre
  LV({ c: [{ x: 180, y: 1020, k: "red" }, { x: 540, y: 1020, k: "blue" }], h: [{ x: 540, y: 340, k: "red" }, { x: 180, y: 340, k: "blue" }], w: [[290, 600, 140, 160]], g: [{ x1: 90, y1: 560, x2: 270, y2: 560, sp: 0.9 }, { x1: 450, y1: 820, x2: 630, y2: 820, sp: 0.9 }] }), // 18
  LV({ c: [{ x: 140, y: 1020, k: "red" }, { x: 360, y: 1020, k: "blue" }, { x: 580, y: 1020, k: "yellow" }], h: [{ x: 580, y: 340, k: "red" }, { x: 360, y: 340, k: "blue" }, { x: 140, y: 340, k: "yellow" }], m: [{ x: 660, y: 560, a: Math.PI, sw: 0.8, sp: 0.8 }], l: [{ x1: 60, y1: 840, x2: 400, y2: 840, on: 1.0, per: 2.2, ph: 0.5 }] }), // 19
  LV({ c: [{ x: 110, y: 1020, k: "red" }, { x: 270, y: 1020, k: "blue" }, { x: 450, y: 1020, k: "yellow" }, { x: 610, y: 1020, k: "purple" }], h: [{ x: 270, y: 340, k: "red" }, { x: 110, y: 340, k: "blue" }, { x: 610, y: 340, k: "yellow" }, { x: 450, y: 340, k: "purple" }], w: [[300, 640, 120, 80]], g: [{ x1: 240, y1: 500, x2: 480, y2: 500, sp: 0.5 }], l: [{ x1: 60, y1: 860, x2: 240, y2: 860, on: 1.0, per: 2.0, ph: 0 }], boss: true }), // 20 BOSS
];
const NL = LEVELS.length;

// ---------- État ----------
const R = 34, HOME_R = 56, SPEED = 520, ACCEL_T = 0.25;
const S = {
  scene: "loading", lvl: 0, best: 0, loot: [], levelsSinceAd: 0, fails: 0,
  chars: [], homes: [], walls: [], guards: [], lasers: [], cams: [], drawing: null,
  t: 0, runT: 0, shake: 0, particles: [], overlayT: 0, paused: false, hintT: 0, failMsg: "BUSTED!", shown: 0, newLoot: -1,
};
const hazardT = () => (S.scene === "run" || S.scene === "fail" || S.scene === "win") ? S.runT : S.t;

function loadLevel(i) {
  const L = LEVELS[i % NL];
  S.lvl = i; S.scene = "draw"; S.runT = 0; S.overlayT = 0; S.particles = []; S.drawing = null;
  S.chars = L.c.map((c) => ({ ...c, path: null, done: false, x0: c.x, y0: c.y, px: c.x, py: c.y, dir: -Math.PI / 2, crashed: false, blink: Math.random() * 3 }));
  S.homes = L.h.map((h) => ({ ...h, pop: 0, lit: false }));
  S.walls = L.w.map(([x, y, w, h]) => ({ x, y, w, h }));
  S.guards = L.g.map((g) => ({ ...g, x: g.x1, y: g.y1, dir: 0 }));
  S.lasers = L.l.map((l) => ({ ...l, active: false }));
  S.cams = L.m.map((m) => ({ ...m, ang: m.a }));
  S.hint = !!L.hint; S.hintT = 0; S.tip = L.tip || ""; S.boss = !!L.boss;
  updateHazards();
}

// ---------- Sauvegarde cloud ----------
async function load() {
  try {
    const raw = await SDK.game.loadData();
    if (raw) { const d = JSON.parse(raw); S.best = d.best || 0; S.lvl = d.lvl || 0; S.loot = Array.isArray(d.loot) ? d.loot : []; }
  } catch (e) { SDK.health.logWarning && SDK.health.logWarning("loadData failed"); }
  S.loaded = true;
}
function save() {
  if (!S.loaded) return; // RÈGLE SDK : jamais saveData avant la fin de loadData
  SDK.game.saveData(JSON.stringify({ lvl: S.lvl, best: S.best, loot: S.loot })).catch(() => {});
}

// ---------- Audio : sons + musique synthétisés, respecte le mute YouTube ----------
let actx = null, master = null, audioOn = SDK.system.isAudioEnabled();
SDK.system.onAudioEnabledChange((on) => { audioOn = on; if (actx) on && !S.paused ? actx.resume() : actx.suspend(); });
let unlocked = false;
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = 1; master.connect(actx.destination); startMusic(); } catch (e) {} }
  if (!actx || !audioOn || S.paused) return;
  if (actx.state !== "running") actx.resume().catch(() => {});
  if (!unlocked) { // iOS Safari : il faut jouer un son (même muet) pendant le geste de l'utilisateur
    try { const b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource(); src.buffer = b; src.connect(actx.destination); src.start(0); unlocked = true; } catch (e) {}
  }
}
["touchend", "pointerup", "click"].forEach((ev) => addEventListener(ev, () => { if (!S.paused) ensureAudio(); }, { passive: true }));
const canPlay = () => actx && audioOn && !S.paused;
function tone(f1, f2, dur, type = "sine", vol = 0.18, when = 0) {
  if (!canPlay()) return;
  const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(f2, 30), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.02);
}
let noiseBuf = null;
function noiseHits(n, dur, f0, f1, vol) {
  if (!canPlay()) return;
  if (!noiseBuf) { noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.05, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4); }
  const t0 = actx.currentTime;
  for (let i = 0; i < n; i++) {
    const t = t0 + Math.random() * dur, src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = noiseBuf; src.playbackRate.value = 0.7 + Math.random() * 0.8;
    f.type = "bandpass"; f.frequency.value = f0 + Math.random() * (f1 - f0); f.Q.value = 0.8;
    g.gain.value = vol * (1 - (t - t0) / dur) * (0.5 + Math.random() * 0.5);
    src.connect(f).connect(g).connect(master); src.start(t);
  }
}
const sfx = {
  pick: () => tone(500, 800, 0.08, "triangle"),
  ok: () => tone(660, 990, 0.12, "triangle"),
  bad: () => tone(300, 150, 0.15, "square", 0.08),
  go: () => { tone(400, 600, 0.1, "triangle"); tone(600, 900, 0.12, "triangle", 0.18, 0.09); },
  home: () => { tone(988, 988, 0.1, "triangle", 0.2); tone(1319, 1319, 0.18, "triangle", 0.2, 0.08); },
  busted: () => { for (let i = 0; i < 4; i++) { tone(880, 880, 0.18, "square", 0.07, i * 0.22); tone(660, 660, 0.18, "square", 0.07, i * 0.22 + 0.11); } tone(220, 60, 0.35, "sawtooth", 0.12); },
  win: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, f * 1.01, 0.18, "triangle", 0.16, i * 0.09)); noiseHits(140, 1.6, 900, 3100, 0.22); },
  loot: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, f, 0.12, "sine", 0.14, 0.6 + i * 0.06)),
};
// Musique "espion" : basse pizzicato + petite mélodie, en boucle (120 bpm, croches)
const BASS = [110, 0, 110, 0, 131, 0, 110, 0, 98, 0, 98, 0, 123, 0, 104, 0];
const MEL = [0, 440, 0, 0, 523, 0, 494, 0, 0, 440, 0, 392, 0, 0, 415, 0];
let step = 0;
function startMusic() {
  setInterval(() => {
    if (!canPlay() || S.scene === "loading") return;
    const b = BASS[step % 16], m = MEL[step % 16], lvlUp = S.scene === "run" ? 1.0 : 0.7;
    if (b) tone(b, b * 0.98, 0.14, "triangle", 0.09 * lvlUp);
    if (m && step % 32 < 16) tone(m, m, 0.09, "square", 0.025 * lvlUp);
    if (step % 4 === 2) noiseHits(1, 0.01, 6000, 9000, 0.05);
    step++;
  }, 125);
}
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

// ---------- Pause / reprise (uniquement via le SDK) ----------
SDK.system.onPause(() => { S.paused = true; if (actx) actx.suspend(); save(); });
SDK.system.onResume(() => { S.paused = false; last = performance.now(); if (actx && audioOn) actx.resume(); });

// ---------- Géométrie ----------
const dist = (a, b, c, d) => Math.hypot(a - c, b - d);
function circleRect(cx, cy, r, w) { const nx = Math.max(w.x, Math.min(cx, w.x + w.w)), ny = Math.max(w.y, Math.min(cy, w.y + w.h)); return dist(cx, cy, nx, ny) < r; }
function segDist(px, py, x1, y1, x2, y2) { const dx = x2 - x1, dy = y2 - y1, l = dx * dx + dy * dy, t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / l)); return dist(px, py, x1 + t * dx, y1 + t * dy); }
function inCone(px, py, cx, cy, ang, len, half) { const d = dist(px, py, cx, cy); if (d > len) return false; let a = Math.atan2(py - cy, px - cx) - ang; a = Math.atan2(Math.sin(a), Math.cos(a)); return Math.abs(a) < half; }
const inBoard = (x, y) => x > 40 && x < W - 40 && y > 230 && y < 1180;
function pointAt(path, d) {
  for (let i = 1; i < path.pts.length; i++) {
    if (d <= path.cum[i]) {
      const a = path.pts[i - 1], b = path.pts[i], seg = path.cum[i] - path.cum[i - 1], t = seg ? (d - path.cum[i - 1]) / seg : 0;
      return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, dir: Math.atan2(b.y - a.y, b.x - a.x) };
    }
  }
  const e = path.pts[path.pts.length - 1]; return { x: e.x, y: e.y, dir: 0 };
}
const GUARD_CONE = 150, GUARD_HALF = 0.42, CAM_CONE = 300, CAM_HALF = 0.32;

// ---------- Boutons ----------
const UI = {
  restart: { x: W - 90, y: 120, r: 46 }, main: { x: W / 2, y: 900, w: 380, h: 110 }, skip: { x: W / 2, y: 1040, w: 380, h: 90 },
  play: { x: W / 2, y: 900, w: 400, h: 120 }, vault: { x: W / 2, y: 1060, w: 300, h: 90 }, back: { x: W / 2, y: 1150, w: 280, h: 90 },
};
const inBtn = (p, b) => b.r ? dist(p.x, p.y, b.x, b.y) < b.r : Math.abs(p.x - b.x) < b.w / 2 && Math.abs(p.y - b.y) < b.h / 2;

// ---------- Entrées ----------
cv.addEventListener("pointerdown", (e) => {
  if (S.paused) return;
  ensureAudio();
  const p = toWorld(e.clientX, e.clientY);
  if (S.scene === "menu") {
    if (inBtn(p, UI.vault)) { S.scene = "vault"; sfx.pick(); return; }
    if (S.lvl >= NL) { S.lvl = 0; save(); }
    loadLevel(S.lvl); sfx.go(); return;
  }
  if (S.scene === "finale") {
    if (S.overlayT < 0.6) return;
    if (inBtn(p, UI.vault)) { S.scene = "vault"; sfx.pick(); return; }
    if (inBtn(p, UI.play)) { S.lvl = 0; save(); loadLevel(0); sfx.go(); }
    return;
  }
  if (S.scene === "vault") { if (inBtn(p, UI.back)) { S.scene = "menu"; sfx.pick(); } return; }
  if (S.scene === "fail") {
    if (inBtn(p, UI.main)) { loadLevel(S.lvl); return; }
    if (S.fails >= 2 && inBtn(p, UI.skip)) { skipWithAd(); return; }
    return;
  }
  if (S.scene === "win") { if (S.overlayT > 0.4 && inBtn(p, UI.main)) nextLevel(); return; }
  if (S.scene !== "draw") return;
  if (inBtn(p, UI.restart)) { loadLevel(S.lvl); return; }
  const c = S.chars.find((c) => dist(p.x, p.y, c.x0, c.y0) < R * 1.7);
  if (c) { c.path = null; S.drawing = { c, pts: [{ x: c.x0, y: c.y0 }] }; S.hint = false; sfx.pick(); try { cv.setPointerCapture(e.pointerId); } catch (er) {} }
});
cv.addEventListener("pointermove", (e) => {
  const d = S.drawing; if (!d || S.scene !== "draw") return;
  const p = toWorld(e.clientX, e.clientY), lp = d.pts[d.pts.length - 1];
  if (dist(p.x, p.y, lp.x, lp.y) < 10) return;
  if (!inBoard(p.x, p.y) || S.walls.some((w) => circleRect(p.x, p.y, R * 0.7, w))) { endStroke(); return; }
  d.pts.push({ x: p.x, y: p.y });
  const h = S.homes.find((h) => h.k === d.c.k);
  if (dist(p.x, p.y, h.x, h.y) < HOME_R) endStroke();
});
cv.addEventListener("pointerup", () => endStroke());
cv.addEventListener("pointercancel", () => endStroke());

function endStroke() {
  const d = S.drawing; if (!d) return; S.drawing = null;
  const h = S.homes.find((h) => h.k === d.c.k), e = d.pts[d.pts.length - 1];
  if (dist(e.x, e.y, h.x, h.y) < HOME_R) {
    d.pts.push({ x: h.x, y: h.y });
    const cum = [0]; for (let i = 1; i < d.pts.length; i++) cum.push(cum[i - 1] + dist(d.pts[i - 1].x, d.pts[i - 1].y, d.pts[i].x, d.pts[i].y));
    d.c.path = { pts: d.pts, cum, len: cum[cum.length - 1] };
    sfx.ok(); burst(h.x, h.y, COL.chars[h.k], 8);
    if (S.chars.every((c) => c.path)) { S.scene = "ready"; S.overlayT = 0; }
  } else sfx.bad();
}

// ---------- Flux de jeu ----------
function nextLevel() {
  if (S.lvl >= NL) { S.scene = "finale"; S.overlayT = 0; confetti(); sfx.win(); return; }
  S.levelsSinceAd++;
  const go = () => loadLevel(S.lvl);
  // Interstitielle : seulement à une pause naturelle, au plus une fois tous les 3 niveaux, jamais avant le niveau 4
  if (S.levelsSinceAd >= 3 && S.lvl >= 4) { S.levelsSinceAd = 0; save(); SDK.ads.requestInterstitialAd().catch(() => {}).finally(go); }
  else go();
}
async function skipWithAd() {
  try { const ok = await SDK.ads.requestRewardedAd("skip-level"); if (ok) { win(true); return; } } catch (e) {}
  loadLevel(S.lvl);
}
function win(skipped) {
  S.scene = "win"; S.overlayT = 0; S.fails = 0; S.shown = S.lvl;
  const li = S.lvl % NL; S.newLoot = S.loot.includes(li) ? -1 : li; if (S.newLoot >= 0) S.loot.push(li);
  S.lvl++; if (S.lvl > S.best) { S.best = S.lvl; SDK.engagement.sendScore({ value: S.best }).catch(() => {}); }
  save(); if (!skipped) { sfx.win(); confetti(); } if (S.newLoot >= 0) sfx.loot();
}
function fail(x, y, msg) {
  S.scene = "fail"; S.overlayT = 0; S.fails++; S.shake = 18; S.failMsg = msg; sfx.busted(); buzz(120);
  burst(x, y, "#ffffff", 18); burst(x, y, COL.laser, 12);
}

function updateHazards() {
  const t = hazardT();
  S.guards.forEach((g) => {
    const k = (Math.sin(t * g.sp * 2 - Math.PI / 2) + 1) / 2, nx = g.x1 + (g.x2 - g.x1) * k, ny = g.y1 + (g.y2 - g.y1) * k;
    if (Math.abs(nx - g.x) + Math.abs(ny - g.y) > 0.01) g.dir = Math.atan2(ny - g.y, nx - g.x);
    else if (g.dir === undefined) g.dir = 0;
    g.x = nx; g.y = ny;
  });
  S.lasers.forEach((l) => (l.active = ((t + l.ph) % l.per) < l.on));
  S.cams.forEach((m) => (m.ang = m.a + Math.sin(t * m.sp * 2) * m.sw));
}

function update(dt) {
  S.t += dt; S.hintT += dt; S.overlayT += dt;
  S.homes.forEach((h) => (h.pop = Math.max(0, h.pop - dt * 2.5)));
  S.chars.forEach((c) => { if (c.done) c.enterT += dt; });
  S.shake = Math.max(0, S.shake - dt * 60);
  if (S.scene === "ready" && S.overlayT > 0.15) { S.scene = "run"; S.runT = 0; sfx.go(); }
  if (S.scene === "run") S.runT += dt;
  if (S.scene !== "fail" && S.scene !== "win") updateHazards();
  if (S.scene === "run") {
    const tr = S.runT, dRun = tr < ACCEL_T ? SPEED * tr * tr / (2 * ACCEL_T) : SPEED * (tr - ACCEL_T / 2);
    for (const c of S.chars) {
      if (c.done) continue;
      const p = pointAt(c.path, dRun); c.px = p.x; c.py = p.y; c.dir = p.dir;
      if (dRun >= c.path.len) { c.done = true; c.enterT = 0; const h = S.homes.find((h) => h.k === c.k); h.pop = 1; h.lit = true; sfx.home(); stars(h.x, h.y - 30, COL.chars[c.k]); }
    }
    const act = S.chars.filter((c) => !c.done);
    for (let i = 0; i < act.length; i++) for (let j = i + 1; j < act.length; j++) {
      const a = act[i], b = act[j];
      if (dist(a.px, a.py, b.px, b.py) < R * 1.7) { a.crashed = b.crashed = true; fail((a.px + b.px) / 2, (a.py + b.py) / 2, "BONK!"); return; }
    }
    for (const c of act) {
      for (const g of S.guards) if (dist(c.px, c.py, g.x, g.y) < R * 1.8 || inCone(c.px, c.py, g.x, g.y, g.dir, GUARD_CONE, GUARD_HALF)) { c.crashed = true; g.alert = true; fail(c.px, c.py, "BUSTED!"); return; }
      for (const l of S.lasers) if (l.active && segDist(c.px, c.py, l.x1, l.y1, l.x2, l.y2) < R * 0.75) { c.crashed = true; fail(c.px, c.py, "ZAPPED!"); return; }
      for (const m of S.cams) if (inCone(c.px, c.py, m.x, m.y, m.ang, CAM_CONE, CAM_HALF)) { c.crashed = true; m.alert = true; fail(c.px, c.py, "SPOTTED!"); return; }
    }
    if (S.chars.every((c) => c.done && c.enterT > 0.35)) win(false);
  } else if (S.scene === "draw" || S.scene === "ready") {
    for (const c of S.chars) { c.px = c.x0; c.py = c.y0; }
  }
  S.particles = S.particles.filter((p) => (p.life -= dt) > 0);
  S.particles.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.rot += p.vr * dt; });
}

// ---------- Particules ----------
function burst(x, y, color, n) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = 150 + Math.random() * 250; S.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 400, life: 0.6, max: 0.6, color, size: 6 + Math.random() * 6, rot: 0, vr: 0 }); } }
function stars(x, y, color) { for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, v = 260 + Math.random() * 220; S.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 700, life: 0.9, max: 0.9, color: i % 2 ? COL.gold : color, size: 22 + Math.random() * 10, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12, star: true }); } }
function confetti() { const cs = Object.values(COL.chars); for (let i = 0; i < 70; i++) S.particles.push({ x: Math.random() * W, y: -20 - Math.random() * 300, vx: (Math.random() - 0.5) * 120, vy: 200 + Math.random() * 200, g: 120, life: 2.6, max: 2.6, color: cs[i % cs.length], size: 10 + Math.random() * 8, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 10, sq: true }); }

function drawBgPlain() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, COL.bg); g.addColorStop(1, COL.bg2);
  ctx.fillStyle = g; ctx.fillRect(-2000, -2000, W + 4000, H + 4000);
}
function drawSides() {
  const left = -ox / scale, right = (cv.width - ox) / scale, side = -left;
  if (side < 60) return; // téléphone en portrait : pas de place
  const t = S.t;
  // projecteurs qui balaient
  ctx.save(); ctx.globalAlpha = 0.14;
  for (const [x0, ph] of [[left + side * 0.35, 0], [left + side * 0.75, 1.7], [W + side * 0.25, 0.9], [W + side * 0.65, 2.6]]) {
    ctx.save(); ctx.translate(x0, -60); ctx.rotate(Math.sin(t * 0.7 + ph) * 0.35);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-120, 1400); ctx.lineTo(120, 1400); ctx.closePath(); ctx.fillStyle = "#fff59d"; ctx.fill(); ctx.restore();
  }
  ctx.restore();
  // butin qui flotte et tourne doucement
  for (let i = 0; i < 10; i++) {
    const onLeft = i % 2 === 0, lane = Math.floor(i / 2);
    const x = onLeft ? left + side * (0.2 + 0.6 * ((lane * 0.37) % 1)) : W + side * (0.2 + 0.6 * ((lane * 0.53) % 1));
    const y = ((lane * 260 + t * (30 + lane * 6)) % 1600) - 160;
    ctx.save(); ctx.globalAlpha = 0.85; ctx.translate(x, H - y); ctx.rotate(Math.sin(t + i) * 0.4);
    drawLoot((i * 3) % NL, 0, 0, 0.9 + (lane % 3) * 0.15, false); ctx.restore();
  }
  // petit voleur poursuivi par un garde, en bas, de chaque côté
  for (const [base, dirS] of [[left, 1], [W, -1]]) {
    const k = ((t * 0.12) % 1), x = dirS > 0 ? base + side * (k * 1.3 - 0.15) : base + side * (1.15 - k * 1.3);
    drawThief({ k: "red", px: x, py: 1150, x0: base, done: false, crashed: false, dir: dirS > 0 ? 0 : Math.PI, blink: 1 }, true);
    const gx = x - dirS * 110; ctx.save(); const gs = { x: gx, y: 1150, dir: dirS > 0 ? 0 : Math.PI, alert: false }; drawGuard(gs); ctx.restore();
  }
}
function drawBoard() {

}

function drawVan(h) {

function drawCone(x, y, ang, len, half, color) {

function drawGuard(g) {
  drawCone(g.x, g.y, g.dir, GUARD_CONE, GUARD_HALF, g.alert ? "rgba(255,46,77,.45)" : "rgba(255,245,157,.55)");
  const bob = Math.abs(Math.sin(hazardT() * 10)) * 4;
  ctx.save(); ctx.translate(g.x, g.y - bob);
  ctx.beginPath(); ctx.ellipse(0, R + bob, R * 0.9, R * 0.28, 0, 0, 6.283); ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 0, R * 1.05, R * 1.1, 0, 0, 6.283); fillStroke(COL.guard, 6);
  rr(-30, -46, 60, 22, 8); fillStroke("#1a237e", 5); rr(-20, -30, 40, 8, 4); fillStroke("#1a237e", 4); // casquette
  ctx.beginPath(); ctx.arc(0, -38, 6, 0, 6.283); ctx.fillStyle = COL.gold; ctx.fill();
  const lx = Math.cos(g.dir) * 5, ly = Math.sin(g.dir) * 4;

function drawLaser(l) {

  ctx.save(); ctx.lineCap = "round";
  if (l.active) {
    ctx.strokeStyle = "rgba(255,46,77,.35)"; ctx.lineWidth = 22; ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke();
    ctx.strokeStyle = COL.laser; ctx.lineWidth = 8; ctx.stroke(); ctx.strokeStyle = "#ffd6dc"; ctx.lineWidth = 3; ctx.stroke();
  } else { ctx.strokeStyle = "rgba(255,46,77,.35)"; ctx.lineWidth = 4; ctx.setLineDash([8, 14]); ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke(); }

function drawPath(pts, color, alpha = 1) {
  if (pts.length < 2) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
  ctx.lineWidth = 22; ctx.strokeStyle = "rgba(29,21,48,.3)"; ctx.stroke();
  ctx.lineWidth = 14; ctx.strokeStyle = color; ctx.setLineDash([2, 24]); ctx.lineDashOffset = -S.t * 60; ctx.stroke();

function drawThief(c, forceIdle) {
  const col = COL.chars[c.k], moving = !forceIdle && S.scene === "run" && !c.done;
  if (c.done && c.enterT > 0.35) return;
  const ent = c.done ? c.enterT / 0.35 : 0;
  const bob = moving ? Math.abs(Math.sin(S.t * 14)) * 8 : Math.sin(S.t * 3 + c.x0) * 3;
  const sq = moving ? 1 + Math.sin(S.t * 28) * 0.06 : 1 + Math.sin(S.t * 3 + c.x0) * 0.03;
  ctx.save(); ctx.translate(c.px, c.py);
  ctx.beginPath(); ctx.ellipse(0, R * 0.9, R * 0.9, R * 0.3, 0, 0, 6.283); ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.fill();

  // sac de butin dans le dos
  ctx.save(); ctx.rotate(moving ? Math.sin(S.t * 14) * 0.2 : 0);
  ctx.beginPath(); ctx.ellipse(R * 0.85, -R * 0.2, R * 0.5, R * 0.55, 0.3, 0, 6.283); fillStroke("#d7ccc8", 5);
  ctx.font = "900 22px system-ui"; ctx.fillStyle = COL.ink; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("$", R * 0.85, -R * 0.15);
  ctx.restore();
  // corps
  ctx.beginPath(); ctx.ellipse(0, 0, R, R * 1.05, 0, 0, 6.283); fillStroke(col, 6);
  ctx.beginPath(); ctx.ellipse(-R * 0.4, R * 0.45, R * 0.22, R * 0.12, -0.4, 0, 6.283); ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fill();
  // bandeau de voleur
  rr(-R - 2, -R * 0.5, R * 2 + 4, R * 0.62, 10); ctx.fillStyle = COL.ink; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-R, -R * 0.2); ctx.quadraticCurveTo(-R - 18, -R * 0.1 + Math.sin(S.t * 10) * 6, -R - 26, R * 0.1); ctx.lineWidth = 7; ctx.strokeStyle = COL.ink; ctx.stroke();

  ctx.restore();
}

  else if (shape === "crown") { P([[-32, 22], [-32, -18], [-16, 0], [0, -26], [16, 0], [32, -18], [32, 22]]); }
  else if (shape === "bar") { P([[-34, 18], [-24, -14], [24, -14], [34, 18]]); }
  else if (shape === "painting") { rr(-32, -26, 64, 52, 4); ctx.fillStyle = locked ? c : "#8d6e63"; ctx.fill(); ctx.stroke(); rr(-22, -16, 44, 32, 2); ctx.fillStyle = c; ctx.fill(); ctx.stroke(); }

  else if (shape === "vase") { ctx.beginPath(); ctx.moveTo(-12, -30); ctx.lineTo(12, -30); ctx.quadraticCurveTo(36, 0, 14, 30); ctx.lineTo(-14, 30); ctx.quadraticCurveTo(-36, 0, -12, -30); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (shape === "banana") { ctx.beginPath(); ctx.moveTo(-30, -20); ctx.quadraticCurveTo(-20, 30, 30, 18); ctx.quadraticCurveTo(-4, 14, -18, -24); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (shape === "trophy") { ctx.beginPath(); ctx.moveTo(-24, -28); ctx.lineTo(24, -28); ctx.quadraticCurveTo(22, 6, 0, 8); ctx.quadraticCurveTo(-22, 6, -24, -28); ctx.closePath(); ctx.fill(); ctx.stroke(); rr(-6, 8, 12, 12, 2); ctx.fill(); ctx.stroke(); rr(-18, 20, 36, 10, 3); ctx.fill(); ctx.stroke(); }
  else if (shape === "duck") { ctx.beginPath(); ctx.ellipse(0, 10, 28, 18, 0, 0, 6.283); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.arc(14, -14, 14, 0, 6.283); ctx.fill(); ctx.stroke(); P([[26, -14], [40, -10], [26, -6]]); }
  else if (shape === "toilet") { rr(-26, -30, 22, 34, 4); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.ellipse(6, 2, 28, 12, 0, 0, 6.283); ctx.fill(); ctx.stroke(); rr(-10, 8, 24, 22, 4); ctx.fill(); ctx.stroke(); }
  if (!locked) { ctx.globalAlpha = 0.8; ctx.fillStyle = COL.white; ctx.beginPath(); ctx.arc(-12, -12, 4, 0, 6.283); ctx.fill(); }
  ctx.restore();
}
function drawBtn(b, label, color, pulseOn = true) {
  const pulse = pulseOn ? 1 + Math.sin(S.t * 6) * 0.03 : 1;
  ctx.save(); ctx.translate(b.x, b.y); ctx.scale(pulse, pulse);
  rr(-b.w / 2, -b.h / 2 + 10, b.w, b.h, 30); ctx.fillStyle = COL.ink; ctx.fill();
  rr(-b.w / 2, -b.h / 2, b.w, b.h, 30); fillStroke(color, 7);
  text(label, 0, 0, b.h * 0.4); ctx.restore();
}
function drawHUD() {
  text(`LEVEL ${(S.scene === "win" ? S.shown : S.lvl) + 1}`, W / 2, 110, 60);
  if (S.boss && S.scene === "draw") text("★ BOSS HEIST ★", W / 2, 165, 30, COL.gold);
  if (S.scene === "draw") {
    const b = UI.restart; ctx.beginPath(); ctx.arc(b.x, b.y + 6, b.r, 0, 6.283); ctx.fillStyle = COL.ink; ctx.fill();
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283); fillStroke(COL.white, 6);
    ctx.beginPath(); ctx.arc(b.x, b.y, 20, 0.6, 5.6); ctx.lineWidth = 8; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(b.x + 22, b.y - 22); ctx.lineTo(b.x + 18, b.y - 2); ctx.lineTo(b.x + 2, b.y - 14); ctx.closePath(); ctx.fillStyle = COL.ink; ctx.fill();
    // compteur de butin
    drawLoot(0, 70, 118, 0.6, false); text(`${S.loot.length}/${NL}`, 108, 120, 34, COL.white, COL.ink, "left");
  }
}
function drawHint() {
  if (S.scene !== "draw") return;
  if (S.tip) text(S.tip, W / 2, 1238, 32, COL.gold);
  if (!S.hint) return;
  const c = S.chars[0], h = S.homes[0], t = Math.min(1, (S.hintT % 1.8) / 1.4);
  const x = c.x0 + (h.x - c.x0) * t, y = c.y0 + (h.y - c.y0) * t;
  drawPath([{ x: c.x0, y: c.y0 }, { x, y }], COL.white, 0.7);
  ctx.save(); ctx.translate(x + 18, y + 30);
  rr(-16, -6, 32, 46, 14); fillStroke("#ffe0bd", 5); rr(-10, -40, 16, 44, 8); fillStroke("#ffe0bd", 5); ctx.restore();
  text("Draw the escape route!", W / 2, 1238, 40);
}
function dim(a) { ctx.fillStyle = `rgba(29,21,48,${a})`; ctx.fillRect(-2000, -2000, W + 4000, H + 4000); }
function popScale(k = 5) { return 0.6 + 0.4 * Math.min(1, S.overlayT * k); }
function drawOverlay() {
  if (S.scene === "fail") {
    dim(0.5 * Math.min(1, S.overlayT * 4));
    ctx.save(); ctx.translate(W / 2, 620); const s = popScale(); ctx.scale(s, s); ctx.rotate(-0.05); text(S.failMsg, 0, 0, 120, COL.laser); ctx.restore();
    drawBtn(UI.main, "RETRY", COL.gold);
    if (S.fails >= 2) drawBtn(UI.skip, "▶ SKIP LEVEL", COL.chars.green);
  }
  if (S.scene === "win") {
    dim(0.45 * Math.min(1, S.overlayT * 4));
    ctx.save(); ctx.translate(W / 2, 400); const s = popScale(); ctx.scale(s, s); ctx.rotate(Math.sin(S.t * 4) * 0.04); text("CLEAN GETAWAY!", 0, 0, 62, COL.gold); ctx.restore();
    const li = S.shown % NL, isNew = S.newLoot >= 0, ls = popScale(3);
    ctx.save(); ctx.translate(W / 2, 620);
    ctx.rotate(S.t * 0.6); for (let i = 0; i < 12; i++) { ctx.rotate(Math.PI / 6); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-24, -230); ctx.lineTo(24, -230); ctx.closePath(); ctx.fillStyle = "rgba(255,201,60,.12)"; ctx.fill(); }
    ctx.restore();
    drawLoot(li, W / 2, 620, 2.6 * ls, false);
    text(isNew ? `NEW: ${LOOT[li][2]}` : LOOT[li][2], W / 2, 770, 42, COL.white);
    text(`VAULT ${S.loot.length}/${NL}`, W / 2, 822, 30, COL.gold);
    if (S.overlayT > 0.4) drawBtn(UI.main, S.lvl >= NL ? "FINISH ★" : "NEXT HEIST", S.lvl >= NL ? COL.gold : COL.chars.green);
  }
}
function drawMenu() {
  drawBgPlain(); drawSides();
  // spots lumineux
  ctx.save(); ctx.globalAlpha = 0.18; for (const [x, a] of [[160, 0.3], [560, -0.3]]) { ctx.save(); ctx.translate(x, -40); ctx.rotate(a + Math.sin(S.t) * 0.15); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-140, 900); ctx.lineTo(140, 900); ctx.closePath(); ctx.fillStyle = "#fff59d"; ctx.fill(); ctx.restore(); } ctx.restore();
  ctx.save(); ctx.translate(W / 2, 330); ctx.rotate(-0.06); text("SNEAKY", 0, -75, 140, COL.gold); text("DASH", 0, 65, 160, COL.chars.red); ctx.restore();
  drawLoot(0, W / 2, 560, 1.4 + Math.sin(S.t * 3) * 0.05, false);
  const demo = ["red", "blue", "yellow"];
  demo.forEach((k, i) => drawThief({ k, px: 220 + i * 140, py: 720 + Math.sin(S.t * 4 + i) * 10, x0: i * 50, done: false, crashed: false, dir: 0, blink: i }, true));
  drawBtn(UI.play, S.lvl >= NL ? "PLAY AGAIN" : S.lvl > 0 ? `PLAY · LVL ${S.lvl + 1}` : "PLAY", COL.chars.green);
  drawBtn(UI.vault, `VAULT ${S.loot.length}/${NL}`, COL.gold, false);
  text("by Lucky Thumb", W / 2, 1210, 28, "#cbb8ef");
}
function drawVault() {
  drawBgPlain();
  text("YOUR VAULT", W / 2, 120, 72, COL.gold);
  text(`${S.loot.length}/${NL} treasures stolen`, W / 2, 190, 32, COL.white);
  for (let i = 0; i < NL; i++) {
    const cx = 120 + (i % 4) * 160, cy = 300 + Math.floor(i / 4) * 160, have = S.loot.includes(i);
    rr(cx - 66, cy - 66, 132, 132, 20); fillStroke(have ? "#4e3a73" : "#33254a", 5);
    if (!have) text("?", cx, cy, 56, "#6b5a8a", "#33254a"); else { drawLoot(i, cx, cy - 8, 1.1, false); }
    if (have) text(LOOT[i][2].split(" ").pop(), cx, cy + 48, 18, COL.white);
  }
  drawBtn(UI.back, "BACK", COL.chars.blue, false);
}
function drawFinale() {
  drawBgPlain(); drawSides();
  ctx.save(); ctx.translate(W / 2, 520); ctx.rotate(S.t * 0.5);
  for (let i = 0; i < 16; i++) { ctx.rotate(Math.PI / 8); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-30, -420); ctx.lineTo(30, -420); ctx.closePath(); ctx.fillStyle = "rgba(255,201,60,.10)"; ctx.fill(); }
  ctx.restore();
  const s = popScale(3);
  ctx.save(); ctx.translate(W / 2, 220); ctx.scale(s, s); ctx.rotate(Math.sin(S.t * 3) * 0.04); text("MASTER", 0, -60, 120, COL.gold); text("THIEF!", 0, 60, 130, COL.chars.red); ctx.restore();
  drawLoot(1, W / 2, 470, 2.4 * s + Math.sin(S.t * 4) * 0.08, false);
  ["red", "blue", "yellow", "purple"].forEach((k, i) => drawThief({ k, px: 165 + i * 130, py: 640 + Math.abs(Math.sin(S.t * 6 + i)) * -24, x0: i * 40, done: false, crashed: false, dir: 0, blink: i }, true));
  text("All 20 heists done!", W / 2, 745, 46);
  text(`Vault: ${S.loot.length}/${NL} treasures`, W / 2, 800, 34, COL.gold);
  text("New heists coming soon…", W / 2, 1180, 28, "#cbb8ef");
  if (S.overlayT > 0.6) { drawBtn(UI.play, "PLAY AGAIN", COL.chars.green); drawBtn(UI.vault, "VAULT", COL.gold, false); }
}
function drawLoading() { drawBgPlain(); text("LOADING…", W / 2, H / 2, 60); }
function drawParticles() {
  for (const p of S.particles) {
    ctx.save(); ctx.globalAlpha = Math.min(1, p.life / p.max * 2); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
    if (p.star) { ctx.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? p.size * 0.22 : p.size * 0.5, a = i * Math.PI / 5 - Math.PI / 2; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = COL.ink; ctx.stroke(); }
    else if (p.sq) ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    else { ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, 6.283); ctx.fill(); }
    ctx.restore();
  }
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = COL.bg2; ctx.fillRect(0, 0, cv.width, cv.height);
  const sh = S.shake ? (Math.random() - 0.5) * S.shake : 0;
  ctx.setTransform(scale, 0, 0, scale, ox + sh * scale, oy + sh * scale);
  if (S.scene === "loading") return drawLoading();
  if (S.scene === "menu") { drawMenu(); return; }
  if (S.scene === "vault") { drawVault(); return; }
  if (S.scene === "finale") { drawFinale(); drawParticles(); return; }
  drawBoard();
  S.walls.forEach(drawCase);
  S.lasers.forEach(drawLaser);
  S.homes.forEach(drawVan);
  S.chars.forEach((c) => c.path && drawPath(c.path.pts, COL.chars[c.k], S.scene === "run" ? 0.5 : 1));
  if (S.drawing) drawPath(S.drawing.pts, COL.chars[S.drawing.c.k]);
  S.cams.forEach(drawCam);
  S.guards.forEach(drawGuard);
  S.chars.forEach((c) => drawThief(c));
  drawHint(); drawHUD(); drawParticles(); drawOverlay();
}

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (S.paused) return; // RÈGLE SDK : tout s'arrête pendant la pause
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
}

// ---------- Démarrage ----------
(async function boot() {
  render();                       // écran de chargement
  SDK.game.firstFrameReady();     // RÈGLE SDK : pendant le chargement
  await load();                   // sauvegarde cloud
  S.scene = "menu";
  requestAnimationFrame(frame);
  SDK.game.gameReady();           // RÈGLE SDK : seulement quand le jeu est interactif
})();
</script>
</body>
